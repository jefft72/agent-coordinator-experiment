name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fork pull requests run with read-only permissions; the deploy job widens its own.
permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build, and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      # playwright.config.ts runs on the Google Chrome stable channel.
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # Builds dist/ and dist-subpath/, then runs the root and subpath browser checks.
      - name: Build and browser tests
        run: npm run test:browser

      # Traces and error-context files for the failed browser checks; they only show the public site.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The site is served under /agent-coordinator-experiment/, so the subpath build is the Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-subpath

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests only run the checks above; deploys come from main only.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; queued deploys wait rather than cancelling a live one.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
